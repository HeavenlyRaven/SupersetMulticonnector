[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-ch_federation"
version = "0.1.0"
description = "ClickHouse Federation extension backend for Apache Superset"
requires-python = ">=3.10"
dependencies = [
    "apache-superset-core",
]

[tool.setuptools.packages.find]
where = ["src"]
