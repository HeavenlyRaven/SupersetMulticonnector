# Disposable databases for exercising a fresh install of this stack —
# started with `fedctl testkit up`, never part of the real product.
#
# Deliberately a SEPARATE, standalone compose project, not an overlay of
# the main compose.yaml (the way compose.dev.yaml is): the whole point is
# testing an INSTALLED copy of fedctl on some other machine, independent
# of whether the real stack's own containers or network exist yet. Every
# database here publishes a host port and gets reached via
# host.docker.internal, from both the host (fedctl's own preflight check)
# and from inside the real stack's containers once it's running — see
# compose.yaml's extra_hosts entries, which make that name resolve on
# Linux too, not just Windows/macOS Docker Desktop.
#
# `fedctl testkit up` prints every connection detail below after starting
# this. See test/testkit/README.md for the manual-equivalent commands and
# a known caveat on plain Linux Docker Engine.

name: superset-federation-testkit

services:
  # Satisfies SQLALCHEMY_DATABASE_URI — the one thing every real install
  # needs from outside itself. An empty database: Superset creates its
  # own schema on first `fedctl install` (`superset db upgrade`).
  metadata-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: superset_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d superset_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A federated PostgreSQL source with real sample rows to join against —
  # same shape and credentials as compose.dev.yaml's dev-postgres, reusing
  # the same sample data, so anyone already familiar with `--dev` from a
  # source checkout recognizes this immediately.
  source-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sampledb
    ports:
      - "5434:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sampledb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A federated MySQL source with real sample rows — mirrors
  # compose.dev.yaml's dev-mysql the same way.
  source-mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: sample-root
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample
      MYSQL_DATABASE: sampledb
    ports:
      - "3307:3306"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psample-root"]
      interval: 5s
      timeout: 3s
      retries: 10
